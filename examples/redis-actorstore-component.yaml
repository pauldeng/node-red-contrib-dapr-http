# Development actor store for actor-demo.json. Substitute any Dapr actor-capable store.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: actorstore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: 127.0.0.1:6379
    - name: redisPassword
      value: ''
    - name: actorStateStore
      value: 'true'

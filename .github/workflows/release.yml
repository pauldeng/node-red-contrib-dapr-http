name: Release

# Publishing happens ONLY from CI, authenticated by GitHub's OIDC identity for
# this workflow run (npm trusted publishing). There is deliberately:
#   - no NPM_TOKEN secret,
#   - no NODE_AUTH_TOKEN,
#   - no .npmrc credential,
#   - and no `npm login` / `npm publish` from anyone's machine.
# The registry verifies the short-lived OIDC token minted for this repository and
# this workflow file, so there is no long-lived publish credential to leak,
# rotate, or accidentally use locally. Provenance is attested from the same
# identity.
#
# One-time owner prerequisite, which only the npm account owner can do: register
# this repository + `.github/workflows/release.yml` as the trusted publisher for
# @pauldeng/node-red-contrib-dapr-http on the registry. Until that exists this
# workflow fails to authenticate, which is the intended failure mode — do not add
# a token secret here to get past it.
#
# That registration is only possible once the package exists, because npm
# configures trusted publishing on a package's settings page. The very first
# published version therefore comes from `.github/workflows/bootstrap-publish.yml`
# — a temporary, manual-dispatch-only workflow that is deleted immediately
# afterwards. See docs/development.md. This file stays token-free throughout.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC identity npm trusted publishing authenticates

jobs:
  publish:
    name: Verify and publish
    # Tags only — including for workflow_dispatch, which can be pointed at a tag
    # ref but must never publish from a branch, where there is no tag to check the
    # version against.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add a required reviewer to this environment in repository settings to gate
    # publishing behind a manual approval. GitHub creates the environment on first
    # use with no protection rules, so naming it here changes nothing until an
    # owner configures it — it makes the approval gate available, not mandatory.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          # Writes the .npmrc that points publishing at the public registry, so it
          # cannot inherit a different one from the runner.
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC token exchange) requires npm >= 11.5.1.
      - run: npm install -g npm@^11
      - run: npm ci
      # The same gates CI enforces on every change: a tag must not be able to
      # ship something that would have failed a pull request.
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:runtime
        timeout-minutes: 10
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
      # The tag must match the version being published, so an installed build is
      # always identifiable from its version alone.
      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # No token env var by design — npm exchanges the OIDC id-token above for a
      # short-lived publish credential. --access public is belt-and-braces
      # alongside publishConfig: npm defaults a SCOPED package to restricted, and
      # a silently-private first publish is the failure worth two guards.
      - run: npm publish --provenance --access public

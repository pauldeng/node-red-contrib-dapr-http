name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dependency advisories are disclosed on their own schedule, not ours: without
  # a periodic run, a new advisory in the reviewed (dev) tree stays invisible
  # until someone happens to open a PR. See docs/testing.md "Security audit".
  schedule:
    - cron: '17 6 * * 1'

# Least privilege: nothing here writes to the repository, so the default
# GITHUB_TOKEN scope is narrowed to reading contents. Publishing is a separate
# workflow with its own explicit id-token permission.
permissions:
  contents: read

# One in-flight run per ref. Pushing twice to a branch cancels the first run
# rather than paying for two full Docker/Playwright tiers on a superseded commit.
# Never keyed on the default branch alone, so main's runs still queue normally.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit/coverage/lint/format (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # '22' is the declared engines.node floor (Node-RED 5.0.1's own minimum),
        # so it is tested rather than merely claimed — see the repository-gates
        # test that asserts these two stay in step.
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:runtime
        timeout-minutes: 10

  docker:
    name: Integration + e2e (Docker, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
      # HEAD^ is the fallback for a scheduled run, which carries neither a PR
      # base nor a push "before" sha.
      - run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}...HEAD"
      - run: printf '@AGENTS.md\n' | cmp -s - CLAUDE.md
      # Node-RED's own packaging checks (naming, metadata, examples, dependency
      # health). Advisory, not a gate: it also warns about Node-RED versions this
      # package deliberately does not support, so a non-zero exit here is
      # information for a human, not a reason to fail the build.
      - run: npm run validate
        continue-on-error: true
      - run: docker compose config --quiet
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
        timeout-minutes: 10
      - run: npm run test:e2e
        timeout-minutes: 6
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7
      # Playwright traces for failures (playwright.config.js retain-on-failure).
      # A timing failure in this tier can be hard to reproduce; without the trace
      # the one occurrence CI catches is not diagnosable after the fact.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

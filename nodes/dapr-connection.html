<script type="text/javascript">
  // A field omitted entirely from a hand-authored or re-imported flow is
  // undefined, not '' — both mean "not set" to every validate function below.
  function isBlank(v) {
    return v === undefined || v === null || v === '';
  }

  RED.nodes.registerType('dapr-connection', {
    category: 'config',
    defaults: {
      name: { value: '' },
      daprHost: { value: '' },
      // A hand-authored or re-imported flow can omit an optional field
      // entirely rather than set it to '' — Node-RED does not backfill
      // defaults.value for a missing key on import, so the node's own value
      // is `undefined`, not ''. Every optional field's validate function must
      // tolerate both, or the node shows a permanent, non-recoverable
      // validation error for a value the runtime already defaults fine
      // (found by driving a real import through a real editor).
      daprPort: {
        value: '',
        validate: function (v) {
          const s = String(isBlank(v) ? '' : v).trim();
          return s === '' || (/^\d+$/.test(s) && Number(s) >= 1 && Number(s) <= 65535);
        },
      },
      bindAddress: { value: '127.0.0.1', required: true },
      appPort: {
        value: '3000',
        required: true,
        validate: function (v) {
          const s = String(isBlank(v) ? '' : v).trim();
          return /^\d+$/.test(s) && Number(s) >= 1 && Number(s) <= 65535;
        },
      },
      bodyLimitMb: {
        value: '4',
        // blank means "use the runtime default of 4" (lib/options.js).
        validate: function (v) {
          if (isBlank(v)) {
            return true;
          }
          const n = Number(v);
          return Number.isFinite(n) && n >= 1 && n <= 64;
        },
      },
      requestTimeoutSec: {
        value: '30',
        // blank means "use the runtime default of 30" (lib/options.js).
        validate: function (v) {
          if (isBlank(v)) {
            return true;
          }
          const n = Number(v);
          return Number.isFinite(n) && n >= 1 && n <= 300;
        },
      },
      tracingEnabled: { value: false },
    },
    credentials: {
      daprApiToken: { type: 'password' },
      appApiToken: { type: 'password' },
    },
    label: function () {
      return this.name || 'dapr sidecar';
    },
    oneditprepare: function () {
      $('#node-config-input-name').closest('.red-ui-tray-body').addClass('dapr-connection-tray');
      // Warn as soon as the bind address stops being loopback: a non-loopback
      // listener is reachable from the network, and the runtime then also
      // requires an app API token (lib/options.js fails closed without one).
      // Blank means the 127.0.0.1 default, so it is not a warning.
      const bindInput = $('#node-config-input-bindAddress');
      const warning = $('#dapr-bind-warning');
      const isLoopback = function (value) {
        const v = String(value || '')
          .trim()
          .toLowerCase();
        return (
          v === '' ||
          v === 'localhost' ||
          v === '::1' ||
          v === '[::1]' ||
          /^127\.\d+\.\d+\.\d+$/.test(v)
        );
      };
      const refresh = function () {
        warning.toggle(!isLoopback(bindInput.val()));
      };
      bindInput.on('input change', refresh);
      refresh();

      // "Test Connection" calls GET /v1.0/metadata against the DEPLOYED
      // connection (this.id is always assigned client-side, but the admin
      // route only finds a node once a deploy has actually registered it) --
      // never the still-open dialog's unsaved fields. Only ever renders the
      // small, fixed set of fields the admin route itself already curated;
      // this code never sees the raw sidecar response.
      const that = this;
      const button = $('#dapr-test-connection');
      const result = $('#dapr-test-connection-result');
      button.on('click', function () {
        button.prop('disabled', true);
        result.removeClass('dapr-test-connection-error').show().text('Testing…');
        const request = $.getJSON('dapr-connection/' + encodeURIComponent(that.id) + '/metadata');
        that._daprMetadataRequest = request;
        request
          .done(function (body) {
            const components = body.components || [];
            const componentSummary = components
              .map(function (c) {
                return c.name + (c.type ? ' (' + c.type + ')' : '');
              })
              .join(', ');
            result.text(
              'Connected — app id "' +
                (body.id || '(unknown)') +
                '", runtime ' +
                (body.runtimeVersion || '(unknown)') +
                ', ' +
                body.componentCount +
                ' component(s)' +
                (componentSummary ? ': ' + componentSummary : '') +
                (body.componentCount > components.length
                  ? ' (showing first ' + components.length + ')'
                  : '') +
                ', ' +
                body.subscriptionCount +
                ' subscription(s).'
            );
          })
          .fail(function (xhr) {
            const message = (xhr.responseJSON && xhr.responseJSON.message) || 'request failed';
            result.addClass('dapr-test-connection-error').text(message);
          })
          .always(function () {
            if (that._daprMetadataRequest === request) {
              that._daprMetadataRequest = null;
            }
            button.prop('disabled', false);
          });
      });
    },
    oneditsave: function () {
      if (this._daprMetadataRequest) {
        this._daprMetadataRequest.abort();
      }
    },
    oneditcancel: function () {
      if (this._daprMetadataRequest) {
        this._daprMetadataRequest.abort();
      }
    },
  });
</script>

<script type="text/html" data-help-name="dapr-connection">
  <p>
    Shared connection to one Dapr sidecar. Publish, subscribe, invoke, and service nodes reference
    this configuration.
  </p>

  <h3>Outbound</h3>
  <p>
    How this app reaches the sidecar's HTTP API. Leave host and port blank to use the sidecar's
    <code>DAPR_HTTP_ENDPOINT</code> environment discovery; otherwise they default to
    <code>127.0.0.1:3500</code>. An optional Dapr API token (else <code>DAPR_API_TOKEN</code>) is
    sent with outbound calls.
  </p>

  <h3>Inbound app channel</h3>
  <p>
    The sidecar delivers subscriptions and service invocations to a dedicated HTTP listener owned by
    this node &mdash; never the Node-RED editor port, so the Admin API is never exposed to the Dapr
    mesh. Point the sidecar's <code>--app-port</code> at this app port (default <code>3000</code>).
    The bind address defaults to loopback; binding to a non-loopback address exposes the listener to
    the network, so it <em>requires</em> an app API token (the node refuses to start without one)
    and should be paired with network-level controls. The editor warns as soon as the value stops
    being loopback.
  </p>
  <p>
    When an App API token is set (credential, else <code>APP_API_TOKEN</code>) it is enforced on
    every inbound request except <code>/healthz</code>.
    <strong>With no token, the app channel authenticates nobody</strong> &mdash; anything that can
    reach the listener can read the subscription list and post deliveries into flows, so it is
    allowed only on loopback, and the node warns on every deploy. The token authenticates the
    sidecar to the app; it does not authorize a calling application. Dapr service-invocation access
    control requires mTLS and Sentry, which this package does not configure. Until an operator
    supplies them, keep the listener on loopback or protect it with network-level controls.
  </p>

  <h3>Advanced</h3>
  <p>
    <b>Body limit</b> bounds a single HTTP body in <em>both</em> directions: what the app channel
    will buffer from an inbound delivery or service call, and what an outbound publish or invocation
    will accept back. An oversized body is rejected rather than buffered &mdash; inbound with
    <code>413</code>, outbound as <code>RESPONSE_TOO_LARGE</code>. <b>Request timeout</b> is the
    whole-request deadline on both sides; <code>dapr-invoke</code> can override it per message.
  </p>

  <h3>Tracing</h3>
  <p>
    Disabled by default. Enabling it on any one <code>dapr-connection</code> activates one
    process-wide OpenTelemetry tracer shared by every connection and node &mdash; there is nothing
    to configure per connection. Service identity, the OTLP endpoint, exporter authentication, and
    sampling all come from the standard <code>OTEL_*</code> environment variables; unset, sampling
    defaults to <code>parentbased_traceidratio</code> at <code>0.1</code>. Publish, invoke,
    subscribe, and service nodes extract and inject the W3C <code>traceparent</code>/
    <code>tracestate</code> headers automatically once tracing is enabled anywhere in the process.
    If Node-RED already has an application-owned OpenTelemetry provider, this integration reuses it
    and does not replace or shut it down.
  </p>
  <p>
    A stopped or unreachable OTLP collector never fails, delays, or retries a message &mdash; export
    happens off the message path, and a failed export is only ever logged. Disabling tracing again
    leaves every other behavior, and the public <code>msg.dapr</code> contract, unchanged.
  </p>

  <h3>Status</h3>
  <p>
    The node polls <code>/v1.0/healthz/outbound</code> and shows connected (green) or sidecar
    unavailable (red). Subscription changes require restarting the sidecar; a routine flow redeploy
    does not.
  </p>

  <h3>Test Connection</h3>
  <p>
    Calls the sidecar's own <code>GET /v1.0/metadata</code> and shows the app id, runtime version,
    the first 20 loaded component names/types, and total component and subscription counts. It tests
    the <strong>deployed</strong> connection, not whatever is currently typed in this still-open
    dialog &mdash; deploy first, then reopen this dialog to test the running configuration.
  </p>
  <p>
    Only that bounded set is shown. Dapr's component entries do not contain component configuration
    values; its arbitrary top-level <code>extended</code> metadata and every other unneeded field
    are excluded. This node never forwards the sidecar's raw response, an API token, or a raw error
    message to the editor; a failure shows a short, fixed description instead.
  </p>

  <h3>Example</h3>
  <p>
    The default topology — Node-RED and <code>daprd</code> sharing one network namespace (a
    Kubernetes pod, or Docker's <code>network_mode: service:node-red</code>) — needs only the app
    port:
  </p>
  <dl class="message-properties">
    <dt>Dapr host / Dapr port</dt>
    <dd>left blank</dd>
    <dt>Bind address</dt>
    <dd><code>127.0.0.1</code> (the default)</dd>
    <dt>App port</dt>
    <dd><code>3000</code>, matching <code>daprd</code>'s own <code>--app-port</code> flag</dd>
  </dl>
</script>

<script type="text/javascript">
  function isStaticMessageProperty(value) {
    const property = typeof value === 'string' ? value.trim() : '';
    let parts;
    try {
      const expression = property.startsWith('msg.') ? property.slice(4) : property;
      parts = RED.utils.normalisePropertyExpression(expression);
    } catch {
      return false;
    }
    return parts[0] !== 'dapr' && !parts.includes('__proto__') && !parts.some(Array.isArray);
  }

  RED.nodes.registerType('dapr-secret-get', {
    category: 'network',
    color: '#DEBD5C',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'dapr-connection', required: true },
      storeName: {
        value: '',
        required: true,
        validate: function (value) {
          return typeof value === 'string' && value.trim() !== '' && !/[/?#]/.test(value);
        },
      },
      key: {
        value: '',
        required: true,
        validate: function (value) {
          return typeof value === 'string' && value.trim() !== '';
        },
      },
      metadata: {
        value: '',
        validate: function (value) {
          try {
            const parsed = JSON.parse(value || '{}');
            return (
              parsed !== null &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Object.entries(parsed).every(
                ([key, item]) =>
                  key.trim() !== '' &&
                  (typeof item === 'string' ||
                    typeof item === 'number' ||
                    typeof item === 'boolean')
              )
            );
          } catch {
            return false;
          }
        },
      },
      property: {
        value: 'payload',
        required: true,
        validate: isStaticMessageProperty,
      },
    },
    inputs: 1,
    outputs: 1,
    icon: 'dapr.svg',
    paletteLabel: 'dapr secret get',
    label: function () {
      return this.name || 'dapr secret get';
    },
    oneditprepare: function () {
      if ($('#node-input-metadata').val() === '{}') {
        $('#node-input-metadata').val('');
      }
      $('#node-input-property').typedInput({ default: 'msg', types: ['msg'] });
    },
  });
</script>

<script type="text/html" data-template-name="dapr-secret-get">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-server"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>
  <div class="form-row">
    <label for="node-input-storeName"><i class="fa fa-lock"></i> Store</label>
    <input type="text" id="node-input-storeName" placeholder="vault" />
  </div>
  <div class="form-row">
    <label for="node-input-key"><i class="fa fa-key"></i> Key</label>
    <input type="text" id="node-input-key" placeholder="apiKey" />
  </div>
  <div class="form-row">
    <label for="node-input-property"><i class="fa fa-sign-in"></i> Property</label>
    <input type="text" id="node-input-property" placeholder="payload" />
  </div>
  <div class="form-row">
    <label for="node-input-metadata"><i class="fa fa-list"></i> Metadata</label>
    <textarea
      id="node-input-metadata"
      rows="4"
      placeholder="{}"
      style="width:70%; resize:vertical"
    ></textarea>
  </div>
</script>

<script type="text/html" data-help-name="dapr-secret-get">
  <p>Reads one secret from a Dapr secret store.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt class="optional">dapr.storeName <span class="property-type">string</span></dt>
    <dd>Overrides the configured secret store name.</dd>
    <dt class="optional">dapr.key <span class="property-type">string</span></dt>
    <dd>Overrides the configured secret key.</dd>
    <dt class="optional">dapr.metadata <span class="property-type">object</span></dt>
    <dd>Per-message component metadata, merged over the configured metadata (message keys win).</dd>
  </dl>

  <h3>Outputs</h3>
  <p>
    On success, the configured <b>Property</b> (a message property path, <code>payload</code> by
    default) is set to the store's own response &mdash; an object of one or more key/value pairs.
    Most secret stores return exactly one pair keyed by the requested key, but Dapr does not
    guarantee that: some stores hold multiple key/value pairs under one secret name.
    <code>msg.dapr = { storeName, key, statusCode }</code>. A component that answers success with no
    data sets the property to <code>null</code>, not an error &mdash; this is distinct from a
    missing key, which real daprd 1.18.4 reports as a <code>500</code> (see below), not a
    <code>204</code>.
  </p>
  <p>
    <b>Property</b> must be a static message path. It cannot use another message property to choose
    its destination and cannot target <code>msg.dapr</code>, which is reserved for the node's result
    metadata. If an existing primitive value blocks the configured path, the node reports
    <code>INVALID_MESSAGE</code> instead of silently discarding the secret.
  </p>
  <p>
    <b
      >This node does not automatically attach the secret's key or value to its status text,
      generated errors, or secret boundary span</b
    >
    &mdash; only the store name and status code do, unlike every other node in this package. Real
    daprd 1.18.4 embeds the requested key directly in its own error text for every secrets failure
    mode, so this node deliberately never forwards that text: a failure reaches a Catch node as one
    of two codes, with a fixed, generic message. <code>SECRET_ACCESS_DENIED</code> means the app's
    own secret-scoping policy (<code>allowedSecrets</code>/<code>deniedSecrets</code>) denied this
    specific key &mdash; a real, reliable signal an operator can act on.
    <code>SECRET_OPERATION_FAILED</code> covers everything else, including a store that doesn't
    exist <em>and</em> a key that doesn't exist in an otherwise-valid store &mdash; Dapr itself does
    not distinguish those two, so this node cannot either. The user-authored node name appears in
    generic flow telemetry, so do not put a secret or sensitive key name there. daprd itself
    receives the key in the request path, and daprd's own logs and traces can contain the secret
    key; configure those sinks as sensitive data too.
  </p>
  <p>
    The returned value is part of the flow message. Do not send it to a Debug node or application
    log; consume it and discard it as soon as the downstream operation finishes.
  </p>
  <p>
    Bulk secret retrieval is not exposed by this package. Dapr's own bulk endpoint applies
    secret-scoping per returned name and silently drops denied entries rather than failing, which
    would hand a Debug node, a message branch, or a trace everything a store holds that scoping
    didn't specifically exclude &mdash; a materially larger accidental-disclosure surface than one
    deny-or-allow lookup at a time.
  </p>
  <p>
    A call still in flight when the flow is redeployed is aborted rather than finished after the
    node is gone, so it fails (reaching a Catch node if one is wired) instead of completing
    silently.
  </p>

  <h3>Example</h3>
  <pre>
msg.dapr = { key: "apiKey" };
return msg;</pre>
</script>

<script type="text/javascript">
  RED.nodes.registerType('dapr-subscribe', {
    category: 'network',
    color: '#f3c969',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'dapr-connection', required: true },
      pubsubName: { value: '', required: true },
      topic: { value: '', required: true },
      ackMode: { value: 'auto' },
      rawPayload: { value: false },
      deadLetterTopic: { value: '' },
      metadata: {
        value: '',
        validate: function (value) {
          try {
            const parsed = JSON.parse(value || '{}');
            return (
              parsed !== null &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Object.entries(parsed).every(
                ([key, item]) =>
                  key.trim() !== '' &&
                  (typeof item === 'string' ||
                    typeof item === 'number' ||
                    typeof item === 'boolean')
              )
            );
          } catch {
            return false;
          }
        },
      },
      rules: { value: [] },
      bulkEnabled: { value: false },
      bulkMaxMessagesCount: {
        value: '',
        // Dapr itself only requires a positive int32; 1-1000 is our own
        // package safety cap (see lib/subscriptions.js BULK_MESSAGES_MAX) —
        // kept in sync with it.
        validate: function (value) {
          if (!value) {
            return true;
          }
          const n = Number(value);
          return Number.isInteger(n) && n >= 1 && n <= 1000;
        },
      },
      bulkMaxAwaitDurationMs: {
        value: '',
        // Our own package safety cap (see lib/subscriptions.js BULK_AWAIT_MS_MAX).
        validate: function (value) {
          if (!value) {
            return true;
          }
          const n = Number(value);
          return Number.isInteger(n) && n >= 1 && n <= 60000;
        },
      },
    },
    inputs: 0,
    outputs: 1,
    icon: 'font-awesome/fa-rss',
    paletteLabel: 'dapr subscribe',
    label: function () {
      return this.name || this.topic || 'dapr subscribe';
    },
    oneditprepare: function () {
      if ($('#node-input-metadata').val() === '{}') {
        $('#node-input-metadata').val('');
      }

      // A single static output (see the module docs above the rules template
      // row for why): every rule just needs a persisted id + match text, kept
      // in list order (order is significant — daprd evaluates rules in order,
      // first match wins). An id is assigned once, the first time a rule is
      // added, and never recomputed from its position, so inserting,
      // removing, or reordering rules never reassigns an EXISTING rule's
      // route (see lib/subscriptions.js normalizeRules for why that matters).
      const list = $('#node-input-rules-container')
        .css('min-height', '120px')
        .css('min-width', '450px')
        .editableList({
          addItem: (container, _index, rule) => {
            const id = rule.id || 'r' + Math.random().toString(36).slice(2, 10);
            container.data('ruleId', id);
            const row = $('<div/>', {
              style: 'display:flex; gap:5px; align-items:center;',
            }).appendTo(container);
            $('<input/>', {
              type: 'text',
              class: 'node-input-rule-match',
              placeholder: 'CEL match, e.g. event.data.kind == "order"',
              style: 'flex:1',
            })
              .val(rule.match || '')
              .appendTo(row);
            // Read-only: this rule's persisted id (see the comment above) is the
            // value a downstream Switch node compares msg.dapr.ruleId against.
            $('<span/>', {
              style:
                'font-family: monospace; font-size: 0.85em; color: var(--red-ui-secondary-text-color); white-space: nowrap;',
              title:
                "This rule's persisted id — compare msg.dapr.ruleId against it in a Switch node",
              text: `id: ${id}`,
            }).appendTo(row);
          },
          removable: true,
          sortable: true,
        });
      (this.rules || []).forEach((rule) => list.editableList('addItem', rule));

      $('#node-input-bulkEnabled').on('change', function () {
        $('#node-bulk-fields').toggle($(this).prop('checked'));
      });
      $('#node-bulk-fields').toggle(this.bulkEnabled);
    },
    oneditsave: function () {
      const rules = [];
      $('#node-input-rules-container')
        .editableList('items')
        .each(function () {
          const match = $(this).find('.node-input-rule-match').val();
          if (match && match.trim() !== '') {
            rules.push({ id: $(this).data('ruleId'), match: match.trim() });
          }
        });
      this.rules = rules;
    },
  });
</script>

    <div class="form-row dapr-cel-row">

<script type="text/html" data-help-name="dapr-subscribe">
  <p>Subscribes to a Dapr pub/sub topic and emits each delivered event.</p>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">object | buffer | any</span></dt>
    <dd>The event data. CloudEvent <code>data_base64</code> is decoded to a Buffer.</dd>
    <dt>dapr.pubsubName / dapr.topic / dapr.route <span class="property-type">string</span></dt>
    <dd>Delivery source information; <code>route</code> is the specific path that matched.</dd>
    <dt>dapr.ruleId <span class="property-type">string | null</span></dt>
    <dd>
      The persisted id of the CEL rule that matched, or <code>null</code> if none matched (or no
      rules are configured). Wire a <code>switch</code> node on this to branch.
    </dd>
    <dt>dapr.deliveryId <span class="property-type">string</span></dt>
    <dd>
      The CloudEvent id. For a single rawPayload delivery this is a generated id (daprd still wraps
      it in a synthetic CloudEvent); for a bulk rawPayload entry it is that entry's
      <code>entryId</code> instead — bulk raw entries carry no CloudEvent at all.
    </dd>
    <dt>dapr.metadata <span class="property-type">object</span></dt>
    <dd>
      Delivery metadata (e.g. tracing headers). In bulk subscribe this instead comes from the
      entry's own metadata, merged over the batch's shared metadata.
    </dd>
    <dt>dapr.cloudEvent <span class="property-type">object | null</span></dt>
    <dd>
      The full CloudEvent envelope daprd delivered (synthetic for a single rawPayload delivery).
      <code>null</code> for a bulk rawPayload entry, which has no CloudEvent wrapper.
    </dd>
    <dt class="optional">dapr.contentType <span class="property-type">string</span></dt>
    <dd>Bulk subscribe only: the content type Dapr reported for this entry.</dd>
    <dt class="optional">dapr.ackId <span class="property-type">string</span></dt>
    <dd>Manual mode only: correlation id to pass to a <code>dapr ack</code> node.</dd>
    <dt class="optional">dapr.entryId <span class="property-type">string</span></dt>
    <dd>Bulk subscribe only: this event's id within its batch — preserve it for the ack node.</dd>
    <dt class="optional">dapr.batchId <span class="property-type">string</span></dt>
    <dd>Bulk subscribe only: the id Dapr assigned to the whole batch this event arrived in.</dd>
  </dl>

  <h3>Acknowledgement</h3>
  <p>
    Automatic acknowledges each event as SUCCESS once it is sent into the flow. Manual holds the
    delivery open until a downstream <code>dapr ack</code> node completes it by
    <code>msg.dapr.ackId</code>; if no ack arrives before the connection's request timeout, the
    event is RETRYed and a warning is logged. In bulk subscribe, every event in a batch is
    acknowledged independently, so one batch can resolve as a mix of SUCCESS/RETRY/DROP.
  </p>

  <h3>Dead-letter topics</h3>
  <p>
    The Dead-letter field sets Dapr's <code>deadLetterTopic</code>. With NATS JetStream on the
    pinned Dapr 1.18.1 runtime, do not use this setting: real integration testing observes the
    original delivery stall before the dead-letter message arrives. Use Redis or broker-side
    dead-letter handling instead.
  </p>

  <h3>CEL routing rules</h3>
  <p>
    CEL rules let Dapr choose a route before the event reaches Node-RED. Add rules only when one
    topic carries different event shapes and you want to branch by content.
  </p>
  <ol>
    <li>Dapr receives a topic event.</li>
    <li>Dapr evaluates rules in order and picks the first match.</li>
    <li>This node emits the event with <code>msg.dapr.ruleId</code> set.</li>
    <li>A downstream <code>switch</code> node branches by that rule id.</li>
  </ol>
  <p>
    Rules are evaluated in order; the first match wins. For ordinary
    <code>dapr publish</code> messages, match application fields under <code>event.data</code>, for
    example <code>event.data.kind == "order"</code>. Match <code>event.type</code> only when the
    publisher sends a custom CloudEvent.
  </p>
  <p>
    This node always has one output. Use a standard <code>switch</code> node on
    <code>msg.dapr.ruleId</code> to branch. Rule routes use persisted ids, so reordering rules does
    not move existing routes. Changing rules still changes the Dapr subscription and requires a
    sidecar restart.
  </p>

  <h3>Bulk subscribe</h3>
  <p>
    Bulk subscribe asks Dapr to deliver multiple topic events in one HTTP request. Use it for
    throughput, not for per-message ordering. Each entry is still acknowledged separately.
  </p>
  <p>
    With CEL routing, Dapr batches per matched route, then this node emits all entries from the same
    single output. Max messages (1-1000) and max await (1-60000ms) are this package's safety caps;
    leave them blank for Dapr's defaults.
  </p>

  <h3>Subscriptions and restart</h3>
  <p>
    Each route is derived from this node's id (and each rule's own persisted id, if any), so a
    routine redeploy keeps working without restarting the sidecar. Adding or removing a
    subscription, or changing pub/sub, topic, metadata, dead-letter topic, raw-payload, rules, or
    bulk subscribe, changes the subscription definition and requires a sidecar restart — the
    connection node shows <code>restart sidecar: subscriptions changed</code> until daprd re-fetches
    <code>/dapr/subscribe</code>.
  </p>

  <h3>References</h3>
  <ul>
    <li>
      <a href="https://v1-18.docs.dapr.io/reference/api/pubsub_api/" target="_blank"
        >Dapr v1.18 pub/sub API</a
      >
    </li>
    <li>
      <a
        href="https://v1-18.docs.dapr.io/developing-applications/building-blocks/pubsub/subscription-methods/"
        target="_blank"
        >Dapr programmatic subscriptions</a
      >
    </li>
    <li>
      <a
        href="https://v1-18.docs.dapr.io/developing-applications/building-blocks/pubsub/pubsub-bulk/"
        target="_blank"
        >Dapr bulk subscribe</a
      >
    </li>
    <li><a href="https://github.com/google/cel-spec" target="_blank">CEL language spec</a></li>
  </ul>

  <h3>Example</h3>
  <p>
    With Ack mode set to Manual, decide the outcome in a downstream Function node and finish with a
    <code>dapr ack</code> node:
  </p>
  <pre>
// Function node after dapr subscribe
msg.dapr.status = msg.payload.orderId ? 'SUCCESS' : 'DROP';
return msg; // msg.dapr.ackId must survive to the dapr ack node</pre>
</script>

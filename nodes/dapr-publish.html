<script type="text/javascript">
  RED.nodes.registerType('dapr-publish', {
    category: 'network',
    color: '#DEBD5C',
    defaults: {
      name: { value: '' },
      connection: { value: '', type: 'dapr-connection', required: true },
      pubsubName: { value: '', required: true },
      topic: { value: '', required: true },
      contentType: { value: '' },
      bulkEnabled: { value: false },
      metadata: {
        value: '',
        validate: function (value) {
          try {
            const parsed = JSON.parse(value || '{}');
            return (
              parsed !== null &&
              typeof parsed === 'object' &&
              !Array.isArray(parsed) &&
              Object.entries(parsed).every(
                ([key, item]) =>
                  key.trim() !== '' &&
                  (typeof item === 'string' ||
                    typeof item === 'number' ||
                    typeof item === 'boolean')
              )
            );
          } catch {
            return false;
          }
        },
      },
    },
    inputs: 1,
    outputs: 1,
    icon: 'dapr.svg',
    paletteLabel: 'dapr publish',
    label: function () {
      return this.name || this.topic || 'dapr publish';
    },
    oneditprepare: function () {
      if ($('#node-input-metadata').val() === '{}') {
        $('#node-input-metadata').val('');
      }
    },
  });
</script>

<script type="text/html" data-template-name="dapr-publish">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-connection"><i class="fa fa-server"></i> Connection</label>
    <input type="text" id="node-input-connection" />
  </div>
  <div class="form-row">
    <label for="node-input-pubsubName"><i class="fa fa-cubes"></i> Pub/sub</label>
    <input type="text" id="node-input-pubsubName" placeholder="pubsub" />
  </div>
  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-rss"></i> Topic</label>
    <input type="text" id="node-input-topic" placeholder="orders" />
  </div>
  <div class="form-row">
    <label for="node-input-contentType"><i class="fa fa-file-o"></i> Content type</label>
    <input type="text" id="node-input-contentType" placeholder="Automatic" />
  </div>
  <div class="form-row">
    <label for="node-input-metadata"><i class="fa fa-list"></i> Metadata</label>
    <textarea
      id="node-input-metadata"
      rows="4"
      placeholder='{"ttlInSeconds":"60"}'
      style="width:70%; resize:vertical"
    ></textarea>
  </div>
  <div class="form-row">
    <label for="node-input-bulkEnabled"><i class="fa fa-clone"></i> Bulk publish</label>
    <input type="checkbox" id="node-input-bulkEnabled" style="display:inline-block; width:auto" />
    <span>msg.payload is an array of entries</span>
  </div>
</script>

<script type="text/html" data-help-name="dapr-publish">
  <p>Publishes <code>msg.payload</code> to a topic through a Dapr sidecar.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>
      payload
      <span class="property-type">buffer | string | object | array | number | boolean | null</span>
    </dt>
    <dd>The payload is required event data. An undefined payload is rejected.</dd>
    <dt class="optional">dapr.pubsubName <span class="property-type">string</span></dt>
    <dd>Overrides the configured pub/sub component for this message.</dd>
    <dt class="optional">dapr.topic <span class="property-type">string</span></dt>
    <dd>Overrides the configured topic for this message.</dd>
    <dt class="optional">dapr.contentType <span class="property-type">string</span></dt>
    <dd>Overrides the configured or inferred content type.</dd>
    <dt class="optional">dapr.metadata <span class="property-type">object</span></dt>
    <dd>Per-message Dapr publish metadata.</dd>
    <dt class="optional">dapr.headers <span class="property-type">object</span></dt>
    <dd>
      Extra HTTP request headers for this publish. The main use is trace context: set
      <code>traceparent</code> so a subscribe &rarr; publish hop stays in one W3C trace. Header
      names and values are validated; <code>content-type</code> and the Dapr API token cannot be set
      this way.
    </dd>
    <dt class="optional">dapr.bulk <span class="property-type">boolean</span></dt>
    <dd>
      Overrides the node's configured Single/Bulk mode for this one message. A missing value keeps
      the configured mode.
    </dd>
  </dl>

  <h3>Content types</h3>
  <p>
    Automatic mode publishes Buffers as <code>application/octet-stream</code>, strings as
    <code>text/plain</code>, and objects, arrays, numbers, booleans, and <code>null</code> as
    <code>application/json</code>. A configured MIME type may be any value supported by the Dapr
    component. See Dapr's
    <a href="https://v1-18.docs.dapr.io/reference/api/pubsub_api/" target="_blank"
      >pub/sub API reference</a
    >
    and the official
    <a href="https://www.iana.org/assignments/media-types/media-types.xhtml" target="_blank"
      >IANA media types registry</a
    >.
  </p>
  <p>
    To publish a custom CloudEvent envelope, set the content type to
    <code>application/cloudevents+json</code>. To bypass Dapr's CloudEvent wrapping, add
    <code>"rawPayload":"true"</code> to metadata.
  </p>

  <h3>Metadata precedence</h3>
  <p>
    Configured metadata and <code>msg.dapr.metadata</code> use a shallow merge; message keys win.
    For example, configured <code>{"rawPayload":"false","ttlInSeconds":"60"}</code> plus message
    metadata <code>{"ttlInSeconds":"10"}</code> publishes
    <code>{"rawPayload":"false","ttlInSeconds":"10"}</code>. Metadata keys must have scalar values,
    which are sent as strings. Neither source object is modified.
  </p>

  <h3>Bulk publish</h3>
  <p>
    With <b>Bulk publish</b> enabled (or <code>msg.dapr.bulk = true</code> for one message),
    <code>msg.payload</code> must be an array of entries instead of a single payload:
  </p>
  <pre>
msg.payload = [
  { entryId: "order-1", payload: { orderId: 1 } },
  { entryId: "order-2", payload: { orderId: 2 }, metadata: { partitionKey: "customer-7" } }
];
return msg;</pre>
  <dl class="message-properties">
    <dt>entryId <span class="property-type">string</span></dt>
    <dd>Required, unique within the batch.</dd>
    <dt>
      payload
      <span class="property-type">buffer | string | object | array | number | boolean | null</span>
    </dt>
    <dd>
      This entry's event data. For an <code>application/octet-stream</code> content type it must be
      a Buffer; for a text or XML content type, a string; otherwise any JSON-serializable value.
    </dd>
    <dt class="optional">contentType <span class="property-type">string</span></dt>
    <dd>
      Falls back to <code>msg.dapr.contentType</code>, then the node's configured content type, then
      to the same automatic inference single publish uses. Dapr's bulk publish API only accepts
      <code>application/json</code>, <code>application/cloudevents+json</code>, a
      <code>text/*</code> type, <code>application/xml</code>, or
      <code>application/octet-stream</code> &mdash; an unsupported type is rejected before
      contacting the sidecar, since Dapr itself would otherwise fail the entire batch.
    </dd>
    <dt class="optional">metadata <span class="property-type">object</span></dt>
    <dd>
      Per-entry metadata; overrides the request-level (configured/<code>msg.dapr.metadata</code>)
      metadata for that entry only.
    </dd>
  </dl>
  <p>
    An empty batch, a missing or duplicate <code>entryId</code>, an unsupported content type, more
    than 1000 entries, or an encoded body over the connection's body limit all fail as
    <code>INVALID_MESSAGE</code> before any request is sent.
  </p>
  <p>
    On success, <code>msg.dapr.bulkResult = { failedEntries: [], entryCount }</code> is added before
    the message is sent on. If Dapr reports any entries failed &mdash; including every entry in the
    batch &mdash; the node calls <code>done(error)</code> with code
    <code>BULK_PUBLISH_PARTIAL</code>
    instead of sending the message, first setting
    <code
      >msg.dapr.bulkResult = { failedEntries: [{ entryId, error }], entryCount, errorCode }</code
    >
    so a Catch node can inspect and retry only the failed entries; the node never resubmits the
    batch automatically. A transport failure or a request-level rejection (for example a bug that
    slipped a duplicate <code>entryId</code> past validation) still follows the existing
    <code>SIDECAR_UNAVAILABLE</code>/<code>PUBLISH_FAILED</code> contract &mdash; this also covers
    the rare case where Dapr's own pub/sub component reports a bulk failure with no specific failed
    entries identified: with nothing for a Catch node to retry, that is reported as
    <code>PUBLISH_FAILED</code>, not as an empty <code>BULK_PUBLISH_PARTIAL</code>.
  </p>

  <h3>Outputs</h3>
  <p>
    On success, single publish sends the original message unchanged; bulk publish adds only the
    <code>msg.dapr.bulkResult</code> summary described above. On failure, the node calls
    <code>done(error)</code> so a Catch node can handle it; messages are not queued while the
    sidecar is unavailable.
  </p>
  <p>
    A publish still in flight when the flow is redeployed is aborted rather than finished after the
    node is gone, so it fails (reaching a Catch node if one is wired) instead of completing
    silently. Redeploy while publishing at a high rate only if losing an in-flight message is
    acceptable, or quiesce the source first.
  </p>
  <h3>Trace context</h3>
  <p>
    When the connection's <b>Tracing</b> checkbox is enabled, this node creates a producer span and
    injects the current W3C <code>traceparent</code>/<code>tracestate</code> into the publish
    request automatically &mdash; nothing to set on the message. With tracing disabled, a delivery
    still arrives with the sidecar's own request headers in <code>msg.dapr.metadata</code>,
    including <code>traceparent</code>; forward it explicitly to keep one trace across the hop:
  </p>
  <pre>
msg.dapr = { headers: { traceparent: msg.dapr.metadata.traceparent } };
return msg;</pre>

  <h3>Example</h3>
  <pre>
msg.payload = { orderId: "ORD-42" };
msg.dapr = {
  topic: "priority-orders",
  metadata: { partitionKey: "customer-7" }
};
return msg;</pre>
</script>

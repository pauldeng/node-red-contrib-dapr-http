# Allows every secret in "secretstore" by default except "forbiddenKey" --
# lets one daprd instance exercise all three real outcomes the secrets
# integration suite needs: allowed-and-present ("apiKey"), allowed-but-absent
# ("missingKey" -- not in secrets.json, but not denied either), and denied
# ("forbiddenKey" -- denied by scope before the component is ever called,
# regardless of whether it's actually in the file).
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: secret-scopes-test
spec:
  secrets:
    scopes:
      - storeName: secretstore
        defaultAccess: allow
        deniedSecrets: ['forbiddenKey']

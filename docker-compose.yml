# Pinned real-stack environment for manually exercising a flow against real
# daprd + Redis + NATS JetStream. NOT what the automated integration tests
# run — they start their own per-suite daprd, broker, AND Node-RED containers
# via `docker run`
# (test/helpers/integration.js, test/helpers/node-red-container.js), each with
# the exact component/resiliency/config fixture and flow that suite needs.
#
# Node-RED itself is NOT a service here: this stack assumes a human runs it
# however they like (e.g. `npm start` against this workspace) on port 3000,
# matching --app-port=3000 below, so daprd needs to reach 127.0.0.1:3000 on
# the host. `network_mode: host` on daprd is this stack's equivalent of the
# documented `network_mode: service:node-red` pattern from docs/deployment.md
# (written for a topology where Node-RED itself runs as a Compose service);
# either way, daprd ends up sharing a network namespace with the app so the
# secure 127.0.0.1-only default stays reachable by both processes.
# Images are pinned by digest, not just tag — see test/helpers/integration.js
# for the re-pin procedure.
#
# NATS runs by default alongside Redis, not behind a Compose profile: the one
# unprofiled `daprd` service below mounts the whole components directory
# regardless of which service containers are running, so profiling only the
# NATS service would still load a pubsub.jetstream component pointed at a
# NATS server that isn't up — profiles gate services, not files inside a
# mounted directory. Its component is named `pubsub-nats`, distinct from
# Redis's `pubsub`, since both live in the same mounted directory.
#
# Unlike Redis, a JetStream stream must exist before pubsub.jetstream will
# work at all — confirmed by reading dapr/components-contrib's
# pubsub/jetstream/jetstream.go: neither Publish() nor Subscribe() ever
# creates one. This stack does not bootstrap it automatically; run this once
# before deploying a flow against `pubsub-nats` (reuses the same
# provisionStream() the automated tests use). Topic names must start with
# "manual." — a bare ">" (capture literally everything) is rejected by NATS
# itself ("capturing all subjects requires no-ack to be true", confirmed
# empirically), so this uses a scoped wildcard instead:
#
#   node -e "require('./test/helpers/nats').provisionStream(4222, { streamName: 'manual', subjects: ['manual.>'] }).then(() => console.log('stream ready'))"
services:
  redis:
    image: redis:8.10-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - '127.0.0.1:6379:6379'

  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    command: ['-js']
    ports:
      - '127.0.0.1:4222:4222'

  daprd:
    image: daprio/daprd:1.18.4@sha256:1e218523a15be5be5f36d64aa33a40cbde8fbe963ba6122d42d9c9de5b24a372
    network_mode: host
    depends_on:
      - redis
      - nats
    volumes:
      - ./test/integration/fixtures/components:/components:ro
    command:
      - './daprd'
      - '--app-id=node-red-dapr-manual'
      - '--app-port=3000'
      - '--app-protocol=http'
      - '--dapr-http-port=3500'
      - '--dapr-listen-addresses=127.0.0.1'
      - '--dapr-internal-grpc-listen-address=127.0.0.1'
      - '--enable-metrics=false'
      - '--dapr-grpc-port=0'
      - '--resources-path=/components'
      - '--log-level=info'
